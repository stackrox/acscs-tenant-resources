{{ if .Values.centralPriority }}
---
kind: PriorityClass
apiVersion: scheduling.k8s.io/v1
metadata:
  name: "{{.Release.Namespace}}-central-{{.Values.centralPriority}}"
value: {{.Values.centralPriority}}
description: "{{.Release.Namespace}} Central Priority"
{{- end}}

{{ if .Values.centralDbPriority }}
---
kind: PriorityClass
apiVersion: scheduling.k8s.io/v1
metadata:
  name: "{{.Release.Namespace}}-central-db-{{.Values.centralDbPriority}}"
value: {{.Values.centralDbPriority}}
description: "{{.Release.Namespace}} Central DB Priority"
{{- end}}


