apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-store-kubernetes
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tenant-resources.labels" . | nindent 4 }}
  annotations: {{- include "tenant-resources.annotations" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-store-kubernetes
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tenant-resources.labels" . | nindent 4 }}
  annotations: {{- include "tenant-resources.annotations" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-store-kubernetes
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tenant-resources.labels" . | nindent 4 }}
  annotations: {{- include "tenant-resources.annotations" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: secret-store-kubernetes
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-store-kubernetes
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret-store-kubernetes
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tenant-resources.labels" . | nindent 4 }}
  annotations: {{- include "tenant-resources.annotations" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: secret-store-kubernetes
