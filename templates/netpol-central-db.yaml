apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-central-db
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tenant-resources.labels" . | nindent 4 }}
  annotations: {{- include "tenant-resources.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: central-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:  # Allow ingress from central
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [central] }
      ports:
        - port: 5432
          protocol: TCP
    - from:  # Allow ingress from observability to scrape metrics
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: [ rhacs-observability, openshift-monitoring ] }
      ports:
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
