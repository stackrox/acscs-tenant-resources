{{- if .Values.centralVpaEnabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: central-vpa
  namespace: {{ .Release.Namespace }}
  labels: {{- include "tenant-resources.labels" . | nindent 4 }}
  annotations: {{- include "tenant-resources.annotations" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       "Deployment"
    name:       "central"
  {{- if .Values.centralVpaUpdatePolicy }}
  updatePolicy: {{ toYaml .Values.centralVpaUpdatePolicy | nindent 4 }}
  {{- end }}
  {{- if .Values.centralVpaResourcePolicy }}
  resourcePolicy: {{ toYaml .Values.centralVpaResourcePolicy | nindent 4 }}
  {{- end }}
  {{- if .Values.centralVpaRecommenders }}
  recommenders: {{ toYaml .Values.centralVpaRecommenders | nindent 4 }}
  {{- end }}
{{ end }}
