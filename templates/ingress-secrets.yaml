{{- if and (.Capabilities.APIVersions.Has "external-secrets.io/v1") .Values.centralIngressManageSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.centralUIExposureCertificateSecret }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-manager-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.centralUIExposureCertificateSecret }}
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ `{{ .cert }}` }}"
        tls.key: "{{ `{{ .key }}` }}"
  data:
    - secretKey: cert # pragma: allowlist secret
      remoteRef:
        key: public-ingress
        property: "tls.crt"
    - secretKey: key # pragma: allowlist secret
      remoteRef:
        key: public-ingress
        property: "tls.key"
{{- end }}
