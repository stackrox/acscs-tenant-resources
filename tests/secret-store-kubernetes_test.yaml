suite: secret-store-kubernetes
templates:
  - templates/secret-store-kubernetes.yaml

tests:
  - it: should render four documents
    asserts:
      - hasDocuments:
          count: 4

  - it: should render a ServiceAccount
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: secret-store-kubernetes

  - it: should render a Role with secrets read access
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: secret-store-kubernetes
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]

  - it: should render a RoleBinding linking the SA to the Role
    documentIndex: 2
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: secret-store-kubernetes
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: roleRef.name
          value: secret-store-kubernetes
      - contains:
          path: subjects
          any: true
          content:
            kind: ServiceAccount
            name: secret-store-kubernetes

  - it: should render a SecretStore with kubernetes provider
    documentIndex: 3
    asserts:
      - isKind:
          of: SecretStore
      - equal:
          path: metadata.name
          value: secret-store-kubernetes
      - equal:
          path: spec.provider.kubernetes.auth.serviceAccount.name
          value: secret-store-kubernetes
      - equal:
          path: spec.provider.kubernetes.server.caProvider.type
          value: ConfigMap
      - equal:
          path: spec.provider.kubernetes.server.caProvider.name
          value: kube-root-ca.crt

  - it: should set remoteNamespace to release namespace
    release:
      namespace: rhacs-test-tenant
    documentIndex: 3
    asserts:
      - equal:
          path: spec.provider.kubernetes.remoteNamespace
          value: rhacs-test-tenant
